<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 760" width="924" height="760" role="img" aria-label="Curio 系统架构图">
  <style>
    :root {
      --canvas-bg: #ffffff;
      --canvas-border: #e2e8f0;
      --fg: #0f172a;
      --muted: #475569;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --group-bg: #f8fafc;
      --pill-muted-bg: #f1f5f9;
      --pill-muted-border: #cbd5e1;
      --badge-bg: #ffffff;
      --badge-border: #cbd5e1;

      --server-bg: #f0fdf4;
      --server-hdr: #dcfce7;
      --server-border: #86efac;
      --server-accent: #15803d;
      --server-line: #16a34a;
      --server-pill-bg: #dcfce7;
      --server-pill-border: #86efac;

      --llm-bg: #faf5ff;
      --llm-hdr: #f3e8ff;
      --llm-border: #d8b4fe;
      --llm-accent: #7e22ce;
      --llm-line: #9333ea;
      --llm-pill-bg: #f3e8ff;
      --llm-pill-border: #d8b4fe;

      --bot-bg: #fffbeb;
      --bot-hdr: #fef3c7;
      --bot-border: #fcd34d;
      --bot-accent: #b45309;
      --bot-line: #d97706;
      --bot-pill-bg: #fef3c7;
      --bot-pill-border: #fcd34d;

      --client-bg: #f0f9ff;
      --client-hdr: #e0f2fe;
      --client-border: #93c5fd;
      --client-accent: #1d4ed8;
      --client-line: #2563eb;
      --client-pill-bg: #dbeafe;
      --client-pill-border: #93c5fd;

      --merge-bg: #fefce8;
      --merge-border: #f59e0b;
      --dashed-bg: #f8fafc;
      --dashed-border: #94a3b8;
      --rcon-line: #64748b;
      --int-line: #d97706;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas-bg: #0d1117;
        --canvas-border: #30363d;
        --fg: #f0f6fc;
        --muted: #9ca3af;
        --card-bg: #161b22;
        --card-border: #30363d;
        --group-bg: #11161d;
        --pill-muted-bg: #21262d;
        --pill-muted-border: #3b434d;
        --badge-bg: #161b22;
        --badge-border: #3b434d;

        --server-bg: #0f2018;
        --server-hdr: #142c20;
        --server-border: #235c3e;
        --server-accent: #4ade80;
        --server-line: #22c55e;
        --server-pill-bg: #143222;
        --server-pill-border: #236342;

        --llm-bg: #1b1228;
        --llm-hdr: #251738;
        --llm-border: #58358a;
        --llm-accent: #c084fc;
        --llm-line: #a855f7;
        --llm-pill-bg: #291a3f;
        --llm-pill-border: #6b3fa0;

        --bot-bg: #20180e;
        --bot-hdr: #2d2111;
        --bot-border: #784b14;
        --bot-accent: #fbbf24;
        --bot-line: #f59e0b;
        --bot-pill-bg: #322310;
        --bot-pill-border: #8a5616;

        --client-bg: #0f1726;
        --client-hdr: #142038;
        --client-border: #26487a;
        --client-accent: #60a5fa;
        --client-line: #3b82f6;
        --client-pill-bg: #16294a;
        --client-pill-border: #2c5594;

        --merge-bg: #271d0f;
        --merge-border: #d97706;
        --dashed-bg: #161b22;
        --dashed-border: #4b5563;
        --rcon-line: #9ca3af;
        --int-line: #fbbf24;
      }
    }

    text {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .canvas { fill: var(--canvas-bg); stroke: var(--canvas-border); }
    .box-server { fill: var(--server-bg); stroke: var(--server-border); }
    .box-llm { fill: var(--llm-bg); stroke: var(--llm-border); }
    .box-bot { fill: var(--bot-bg); stroke: var(--bot-border); }
    .box-client { fill: var(--client-bg); stroke: var(--client-border); }
    .hdr-server { fill: var(--server-hdr); }
    .hdr-llm { fill: var(--llm-hdr); }
    .hdr-bot { fill: var(--bot-hdr); }
    .hdr-client { fill: var(--client-hdr); }
    .subcard { fill: var(--card-bg); stroke: var(--card-border); }
    .subcard-dashed { fill: var(--dashed-bg); stroke: var(--dashed-border); stroke-dasharray: 4 3; }
    .subcard-merge { fill: var(--merge-bg); stroke: var(--merge-border); }

    .pill-server { fill: var(--server-pill-bg); stroke: var(--server-pill-border); }
    .pill-llm { fill: var(--llm-pill-bg); stroke: var(--llm-pill-border); }
    .pill-bot { fill: var(--bot-pill-bg); stroke: var(--bot-pill-border); }
    .pill-info { fill: var(--client-pill-bg); stroke: var(--client-pill-border); }
    .pill-muted { fill: var(--pill-muted-bg); stroke: var(--pill-muted-border); }
    .badge-bg { fill: var(--badge-bg); stroke: var(--badge-border); }
    .badge-mc { fill: var(--server-pill-bg); stroke: var(--server-border); }
    .badge-llm { fill: var(--llm-pill-bg); stroke: var(--llm-border); }
    .badge-sse { fill: var(--client-pill-bg); stroke: var(--client-border); }

    .t-title { fill: var(--fg); font-size: 14.5px; font-weight: 700; }
    .t-card-title { fill: var(--fg); font-size: 12.8px; font-weight: 650; }
    .t-body { fill: var(--muted); font-size: 11.4px; font-weight: 450; }
    .t-small { fill: var(--muted); font-size: 10.6px; font-weight: 450; }
    .t-pill-server { fill: var(--server-accent); font-size: 10.8px; font-weight: 600; }
    .t-pill-llm { fill: var(--llm-accent); font-size: 10.8px; font-weight: 600; }
    .t-pill-bot { fill: var(--bot-accent); font-size: 10.8px; font-weight: 600; }
    .t-pill-info { fill: var(--client-accent); font-size: 10.8px; font-weight: 600; }
    .t-pill-muted { fill: var(--fg); font-size: 10.6px; font-weight: 600; }

    .dot-server { fill: var(--server-line); }
    .dot-llm { fill: var(--llm-line); }
    .dot-bot { fill: var(--bot-line); }
    .dot-client { fill: var(--client-line); }

    .line-mc { stroke: var(--server-line); stroke-width: 1.9; fill: none; }
    .line-rcon { stroke: var(--rcon-line); stroke-width: 1.6; stroke-dasharray: 4 3; fill: none; }
    .line-llm { stroke: var(--llm-line); stroke-width: 1.9; fill: none; }
    .line-sse { stroke: var(--client-line); stroke-width: 2.0; fill: none; }
    .line-internal { stroke: var(--int-line); stroke-width: 1.6; fill: none; }

    .arr-mc { fill: var(--server-line); }
    .arr-rcon { fill: var(--rcon-line); }
    .arr-llm { fill: var(--llm-line); }
    .arr-sse { fill: var(--client-line); }
    .arr-int { fill: var(--int-line); }
  </style>

  <defs>
    <marker id="arr-mc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="arr-mc" d="M 1 1.5 L 9 5 L 1 8.5 z" />
    </marker>
    <marker id="arr-rcon" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arr-rcon" d="M 1 1.5 L 9 5 L 1 8.5 z" />
    </marker>
    <marker id="arr-llm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="arr-llm" d="M 1 1.5 L 9 5 L 1 8.5 z" />
    </marker>
    <marker id="arr-sse" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="arr-sse" d="M 1 1.5 L 9 5 L 1 8.5 z" />
    </marker>
    <marker id="arr-int" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="arr-int" d="M 1 1.5 L 9 5 L 1 8.5 z" />
    </marker>
    <clipPath id="clip-server"><rect x="14" y="12" width="438" height="170" rx="12" /></clipPath>
    <clipPath id="clip-llm"><rect x="472" y="12" width="438" height="170" rx="12" /></clipPath>
    <clipPath id="clip-bot"><rect x="14" y="246" width="896" height="318" rx="12" /></clipPath>
    <clipPath id="clip-client"><rect x="14" y="624" width="896" height="124" rx="12" /></clipPath>
  </defs>

  <rect class="canvas" x="1" y="1" width="922" height="758" rx="14" stroke-width="1" />

  <!-- ==================== TOP LEFT: MINECRAFT SERVER ==================== -->
  <g>
    <rect class="box-server" x="14" y="12" width="438" height="170" rx="12" stroke-width="1.5" />
    <rect class="hdr-server" x="14" y="12" width="438" height="36" clip-path="url(#clip-server)" />
    <circle class="dot-server" cx="32" cy="30" r="5" />
    <text class="t-title" x="45" y="35">Minecraft 1.20.1 服务端</text>
    <rect class="pill-server" x="298" y="20" width="142" height="20" rx="10" stroke-width="1" />
    <text class="t-pill-server" x="369" y="34" text-anchor="middle">原版 · 无需服务端模组</text>

    <rect class="subcard" x="28" y="58" width="410" height="52" rx="8" stroke-width="1" />
    <text class="t-card-title" x="40" y="76">原版游戏协议（TCP 25565）</text>
    <text class="t-body" x="40" y="95">同步区块、实体、物理状态、背包、聊天与成就进度</text>

    <rect class="subcard-dashed" x="28" y="118" width="410" height="52" rx="8" stroke-width="1" />
    <text class="t-card-title" x="40" y="136">可选 RCON 通道（TCP 25575）</text>
    <text class="t-body" x="40" y="155">自动 <tspan class="mono">/spectate</tspan> 附身、游戏规则设置与控制台救援/管理</text>
  </g>

  <!-- ==================== TOP RIGHT: LLM & MEMORY SERVICES ==================== -->
  <g>
    <rect class="box-llm" x="472" y="12" width="438" height="170" rx="12" stroke-width="1.5" />
    <rect class="hdr-llm" x="472" y="12" width="438" height="36" clip-path="url(#clip-llm)" />
    <circle class="dot-llm" cx="490" cy="30" r="5" />
    <text class="t-title" x="503" y="35">LLM 与长期记忆后端</text>
    <rect class="pill-llm" x="758" y="20" width="140" height="20" rx="10" stroke-width="1" />
    <text class="t-pill-llm" x="828" y="34" text-anchor="middle">OpenAI 兼容接口</text>

    <rect class="subcard" x="486" y="58" width="410" height="52" rx="8" stroke-width="1" />
    <text class="t-card-title" x="498" y="76">LLM 服务（OpenAI · DeepSeek · Ollama · mock）</text>
    <text class="t-body" x="498" y="95">流式 <tspan class="mono">/chat/completions</tspan> · 支持独立代码模型与前缀缓存</text>

    <rect class="subcard-dashed" x="486" y="118" width="410" height="52" rx="8" stroke-width="1" />
    <text class="t-card-title" x="498" y="136">可选 Hindsight 情境记忆（Docker :8888）</text>
    <text class="t-body" x="498" y="155">长期经历整理与按线索召回 · 故障时自动回退本地记忆</text>
  </g>

  <!-- ==================== TOP <-> AGENT CONNECTORS ==================== -->
  <g>
    <line class="line-mc" x1="154" y1="185" x2="154" y2="243" marker-start="url(#arr-mc)" marker-end="url(#arr-mc)" />
    <rect class="badge-mc" x="80" y="201" width="148" height="24" rx="6" stroke-width="1" />
    <text class="t-pill-server" x="154" y="217" text-anchor="middle">Mineflayer 协议</text>

    <line class="line-rcon" x1="340" y1="246" x2="340" y2="185" marker-end="url(#arr-rcon)" />
    <rect class="badge-bg" x="272" y="201" width="136" height="24" rx="6" stroke-width="1" />
    <text class="t-pill-muted" x="340" y="217" text-anchor="middle">可选 RCON 指令</text>

    <line class="line-llm" x1="596" y1="185" x2="596" y2="243" marker-start="url(#arr-llm)" marker-end="url(#arr-llm)" />
    <rect class="badge-llm" x="524" y="201" width="144" height="24" rx="6" stroke-width="1" />
    <text class="t-pill-llm" x="596" y="217" text-anchor="middle">异步 LLM 调用</text>

    <line class="line-rcon" x1="786" y1="185" x2="786" y2="243" marker-start="url(#arr-rcon)" marker-end="url(#arr-rcon)" />
    <rect class="badge-bg" x="712" y="201" width="148" height="24" rx="6" stroke-width="1" />
    <text class="t-pill-muted" x="786" y="217" text-anchor="middle">经历写入 / 召回</text>
  </g>

  <!-- ==================== MIDDLE: CURIO AGENT PROCESS ==================== -->
  <g>
    <rect class="box-bot" x="14" y="246" width="896" height="318" rx="12" stroke-width="1.5" />
    <rect class="hdr-bot" x="14" y="246" width="896" height="36" clip-path="url(#clip-bot)" />
    <circle class="dot-bot" cx="32" cy="264" r="5" />
    <text class="t-title" x="45" y="269">Curio Agent 主进程</text>
    <text class="t-body" x="188" y="269">Node.js 22 LTS · TypeScript · 守护进程自动重启</text>

    <rect class="pill-bot" x="590" y="254" width="96" height="20" rx="10" stroke-width="1" />
    <text class="t-pill-bot" x="638" y="268" text-anchor="middle">非透视视觉</text>
    <rect class="pill-bot" x="692" y="254" width="96" height="20" rx="10" stroke-width="1" />
    <text class="t-pill-bot" x="740" y="268" text-anchor="middle">边做边想</text>
    <rect class="pill-bot" x="794" y="254" width="104" height="20" rx="10" stroke-width="1" />
    <text class="t-pill-bot" x="846" y="268" text-anchor="middle">JS 技能沙箱</text>

    <!-- Tier 1: Perception, Memory, Knowledge -->
    <rect class="subcard" x="28" y="294" width="282" height="72" rx="8" stroke-width="1" />
    <text class="t-card-title" x="40" y="313">视觉与感知 · <tspan class="mono">src/perception/</tspan></text>
    <text class="t-body" x="40" y="332">射线视野、遮挡、光照与听觉半径模拟</text>
    <text class="t-small" x="40" y="350">禁止透视接口（<tspan class="mono">NO_XRAY</tspan>）· 结构化摘要</text>

    <rect class="subcard" x="322" y="294" width="280" height="72" rx="8" stroke-width="1" />
    <text class="t-card-title" x="334" y="313">3D 空间与记忆 · <tspan class="mono">src/spatial/</tspan></text>
    <text class="t-body" x="334" y="332">SQLite 3D 体素记忆 + 容量保留裁剪</text>
    <text class="t-small" x="334" y="350">地标、容器账本、传送门与情景归档</text>

    <rect class="subcard" x="614" y="294" width="282" height="72" rx="8" stroke-width="1" />
    <text class="t-card-title" x="626" y="313">知识库与技能书 · <tspan class="mono">knowledge/</tspan></text>
    <text class="t-body" x="626" y="332">本地 Java 1.20.1 百科与身体操作手册</text>
    <text class="t-small" x="626" y="350">按需只读查询 · 自写 <tspan class="mono">SKILL.md</tspan> 技能书</text>

    <line class="line-internal" x1="169" y1="366" x2="169" y2="387" marker-end="url(#arr-int)" />
    <line class="line-internal" x1="462" y1="366" x2="462" y2="387" marker-end="url(#arr-int)" />
    <line class="line-internal" x1="755" y1="366" x2="755" y2="387" marker-end="url(#arr-int)" />

    <!-- Tier 2: Mind & Learning Loop -->
    <rect class="subcard-merge" x="28" y="390" width="868" height="74" rx="8" stroke-width="1.3" />
    <text class="t-card-title" x="42" y="410">真人式心智与自主学习闭环 · <tspan class="mono">src/mind/ · src/codeskills/ · src/building/</tspan></text>
    <rect class="pill-bot" x="694" y="396" width="188" height="20" rx="10" stroke-width="1" />
    <text class="t-pill-bot" x="788" y="410" text-anchor="middle">目标与玩法由 Agent 自主决定</text>

    <rect class="pill-muted" x="42" y="428" width="112" height="23" rx="6" stroke-width="1" />
    <text class="t-pill-muted" x="98" y="443.5" text-anchor="middle">1. 注意力筛选</text>
    <text class="t-card-title" x="162" y="444" text-anchor="middle">›</text>
    <rect class="pill-llm" x="170" y="428" width="144" height="23" rx="6" stroke-width="1" />
    <text class="t-pill-llm" x="242" y="443.5" text-anchor="middle">2. 瞥一眼 / 认真想</text>
    <text class="t-card-title" x="322" y="444" text-anchor="middle">›</text>
    <rect class="pill-bot" x="330" y="428" width="148" height="23" rx="6" stroke-width="1" />
    <text class="t-pill-bot" x="404" y="443.5" text-anchor="middle">3. 一段活 Routine</text>
    <text class="t-card-title" x="486" y="444" text-anchor="middle">›</text>
    <rect class="pill-server" x="494" y="428" width="152" height="23" rx="6" stroke-width="1" />
    <text class="t-pill-server" x="570" y="443.5" text-anchor="middle">4. 实测验收与回想</text>
    <text class="t-card-title" x="654" y="444" text-anchor="middle">›</text>
    <rect class="pill-info" x="662" y="428" width="220" height="23" rx="6" stroke-width="1" />
    <text class="t-pill-info" x="772" y="443.5" text-anchor="middle">5. 技能锻造改进 · 建筑师子代理</text>

    <line class="line-internal" x1="252" y1="464" x2="252" y2="485" marker-end="url(#arr-int)" />
    <line class="line-internal" x1="672" y1="464" x2="672" y2="485" marker-end="url(#arr-int)" />

    <!-- Tier 3: Execution & Safety -->
    <rect class="subcard" x="28" y="488" width="428" height="64" rx="8" stroke-width="1" />
    <text class="t-card-title" x="40" y="507">仲裁器与反射层 · <tspan class="mono">src/arbiter/ · src/brain/</tspan></text>
    <text class="t-body" x="40" y="526">计划版本、动作取消、动作守卫、卡死检测与行为技能触发</text>
    <text class="t-small" x="40" y="542">按实测证据触发已验收的自主行为技能，不预设通关流程</text>

    <rect class="subcard" x="468" y="488" width="428" height="64" rx="8" stroke-width="1" />
    <text class="t-card-title" x="480" y="507">技能库与游戏适配器 · <tspan class="mono">src/skills/ · src/adapter/</tspan></text>
    <text class="t-body" x="480" y="526">可组合基础动作：移动、挖掘、放置、合成、界面、战斗、传送门</text>
    <text class="t-small" x="480" y="542">独立工作线程 VM 沙箱执行 Agent 自写的 JS 代码技能</text>
  </g>

  <!-- ==================== AGENT <-> OBSERVATION CONNECTORS ==================== -->
  <g>
    <line class="line-sse" x1="242" y1="567" x2="242" y2="621" marker-start="url(#arr-sse)" marker-end="url(#arr-sse)" />
    <rect class="badge-sse" x="116" y="582" width="252" height="24" rx="6" stroke-width="1" />
    <text class="t-pill-info" x="242" y="598" text-anchor="middle">HTTP / SSE · 实时状态与控制</text>

    <line class="line-sse" x1="682" y1="564" x2="682" y2="621" marker-end="url(#arr-sse)" />
    <rect class="badge-sse" x="546" y="582" width="272" height="24" rx="6" stroke-width="1" />
    <text class="t-pill-info" x="682" y="598" text-anchor="middle">只读 SSE · /api/observer/stream</text>
  </g>

  <!-- ==================== BOTTOM: OBSERVATION & CONTROL ==================== -->
  <g>
    <rect class="box-client" x="14" y="624" width="896" height="124" rx="12" stroke-width="1.5" />
    <rect class="hdr-client" x="14" y="624" width="896" height="34" clip-path="url(#clip-client)" />
    <circle class="dot-client" cx="32" cy="641" r="5" />
    <text class="t-title" x="45" y="646">本地观测与控制</text>
    <text class="t-body" x="166" y="646">默认仅监听 <tspan class="mono">127.0.0.1:3001</tspan></text>
    <rect class="pill-info" x="724" y="631" width="172" height="20" rx="10" stroke-width="1" />
    <text class="t-pill-info" x="810" y="645" text-anchor="middle">Web 控制台 · 观察者 HUD</text>

