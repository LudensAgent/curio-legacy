name: minecraftllm-memory

services:
  hindsight:
    # Published official version; keep the server and TypeScript client aligned.
    image: ghcr.io/vectorize-io/hindsight:1.1.0
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9999:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: "${HINDSIGHT_API_LLM_PROVIDER:-openai}"
      HINDSIGHT_API_LLM_API_KEY: "${HINDSIGHT_API_LLM_API_KEY:-}"
      HINDSIGHT_API_LLM_BASE_URL: "${HINDSIGHT_API_LLM_BASE_URL:-https://api.openai.com/v1}"
      HINDSIGHT_API_LLM_MODEL: "${HINDSIGHT_API_LLM_MODEL:-gpt-5-mini}"
      HINDSIGHT_API_WORKER_ID: minecraftllm-memory
      # Chinese gameplay notes require multilingual retrieval models.
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: "${HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}"
      HINDSIGHT_API_RERANKER_PROVIDER: local
      HINDSIGHT_API_RERANKER_LOCAL_MODEL: "${HINDSIGHT_API_RERANKER_LOCAL_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}"
      HF_HOME: /home/hindsight/.cache/huggingface
      HF_HUB_CACHE: /home/hindsight/.cache/huggingface/hub
    volumes:
      # Do not place a running PostgreSQL data directory inside DATA_DIR.
      # memory:clear deletes the application's banks through the Hindsight API.
      - memory-db:/home/hindsight/.pg0
      - memory-models:/home/hindsight/.cache/huggingface

volumes:
  memory-db:
  memory-models:
